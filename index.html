<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Johnny Hng — Projects</title>
  <meta name="description" content="Projects by Johnny Hng.">
  <meta name="theme-color" content="#18241f">
  <link rel="canonical" href="https://johnnyhng.github.io/">
  <link rel="icon" href="eztalk/assets/favicon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; background: #f7f8f5; color: #18241f; font: 16px/1.6 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 760px); }
    .eyebrow { color: #16624a; font-size: .82rem; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: .4rem 0 1rem; font-size: clamp(2.5rem, 8vw, 5rem); line-height: 1.05; letter-spacing: -.04em; }
    .intro { color: #5a6862; font-size: 1.15rem; }
    .card { display: block; margin-top: 3rem; padding: 1.5rem; border: 1px solid #dce3de; border-radius: 18px; background: #fff; color: inherit; text-decoration: none; box-shadow: 0 16px 40px rgba(22,52,41,.07); }
    .card:hover { border-color: #16624a; transform: translateY(-2px); }
    .card strong { display: block; font-size: 1.25rem; }
    .card span { color: #5a6862; }
    .arrow { float: right; color: #16624a; font-size: 1.5rem; }
    footer { margin-top: 3rem; color: #6a756f; font-size: .9rem; }
    a:focus-visible { outline: 3px solid #e0a900; outline-offset: 4px; }
    @media (prefers-reduced-motion: no-preference) { .card { transition: transform .18s ease, border-color .18s ease; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Projects</p>
    <h1>Johnny Hng</h1>
    <p class="intro">A simple home for public projects and product information.</p>
    <a class="card" href="eztalk/">
      <span class="arrow" aria-hidden="true">→</span>
      <strong>ezTalk</strong>
      <span>Personalized assistive communication that helps preserve the user’s meaning and voice.</span>
    </a>
    <footer>© 2026 Johnny Hng</footer>
  </main>
</body>
</html>
